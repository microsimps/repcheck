[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "microsimps-repcheck"
version = "0.1.0"
description = "比较评测集与线上流量在长度、类别、难度上的分布差异，量化覆盖缺口"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "microsimps" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://microsimps.github.io"
Repository = "https://github.com/microsimps/repcheck"
Issues = "https://github.com/microsimps/repcheck/issues"

[project.scripts]
repcheck = "repcheck:main"

[tool.setuptools]
py-modules = ["repcheck"]
